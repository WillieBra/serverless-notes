name: Build and test notes app

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_localstack:
        description: Deploy to LocalStack using the repository LOCALSTACK_AUTH_TOKEN secret
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build frontend, Lambda functions, and CDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-3.3.1.cjs install --immutable
      - name: Build application
        run: |
          node .yarn/releases/yarn-3.3.1.cjs build:backend
          node .yarn/releases/yarn-3.3.1.cjs build:frontend
          node .yarn/releases/yarn-3.3.1.cjs workspace @aws-sdk-notes-app/infra build

  cdk:
    name: Setup infrastructure using CDK
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_localstack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk
        run: npm install -g @localstack/lstk

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          LOCALSTACK_DNS_ADDRESS: "0"
          LOCALSTACK_DEBUG: "1"
        run: lstk start

      - name: Install CDK
        run: |
          npm install -g aws-cdk
          lstk cdk --version

      - name: Install dependencies
        run: yarn

      - name: Prepare Lambda functions
        run: yarn build:backend

      - name: Bootstrap the infrastructure
        run: |
          yarn cdklocal bootstrap
          sleep 10

      - name: Deploy the infrastructure
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_on: error
          timeout_seconds: 120
          retry_wait_seconds: 10
          command: |
            yarn cdklocal deploy

      - name: Generate a Diagnostic Report
        if: failure()
        run: |
          curl -s localhost:4566/_localstack/diagnose | gzip -cf > diagnose.json.gz

      - name: Upload the Diagnostic Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose.json.gz
          path: ./diagnose.json.gz
